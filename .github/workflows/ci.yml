name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate Compose configuration
        run: docker compose --profile test --profile smoke config --quiet
      - name: Frontend npm ci, lint, TypeScript, Vitest, and build
        run: docker compose --profile test run --build --rm --no-deps frontend-test
      - name: Backend Maven verify with MySQL 8.4
        run: docker compose --profile test run --build --rm backend-test
      - name: Build runtime images
        run: docker compose build backend frontend
      - name: Start clean stack and wait for health
        run: docker compose up --build -d --wait
      - name: Smoke success, three failures, multiple tasks, and user isolation
        run: docker compose --profile smoke run --rm smoke
      - name: Stop stack without deleting named volumes
        run: docker compose down
      - name: Restart on retained volumes
        run: docker compose up -d --wait
      - name: Verify retained history and image files
        run: SMOKE_MODE=persist docker compose --profile smoke run --rm smoke
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop test containers
        if: always()
        run: docker compose --profile test --profile smoke down --volumes
